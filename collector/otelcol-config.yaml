# Sample collector config for Weaver live-check PoC.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  weaver:
    wasm_path: weaver_wasm.wasm

exporters:
  debug:
    verbosity: basic
  otlp:
    endpoint: localhost:4319
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [weaver]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [weaver]
      exporters: [debug]
    logs:
      receivers: [otlp]
      exporters: [debug]
