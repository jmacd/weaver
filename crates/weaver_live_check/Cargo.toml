[package]
name = "weaver_live_check"
version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
weaver_common = { path = "../weaver_common", default-features = false }
weaver_forge = { path = "../weaver_forge", default-features = false }
weaver_resolved_schema = { path = "../weaver_resolved_schema", default-features = false }
weaver_semconv = { path = "../weaver_semconv", default-features = false }
weaver_checker = { path = "../weaver_checker" }

thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
miette.workspace = true
schemars.workspace = true
log.workspace = true

# Heavy deps gated behind "io" feature
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry-stdout = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[features]
default = ["io"]
io = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry-stdout",
    "dep:tokio",
    "weaver_common/io",
    "weaver_forge/codegen",
    "weaver_resolved_schema/io",
    "weaver_semconv/io",
]

[dev-dependencies]
tempfile = "=3.27.0"
serde_yaml.workspace = true

[lints]
workspace = true

[package.metadata.cargo-machete]
# force cargo machete to ignore the following crates
# remove this section once this crate is integrated into the rest
# of the project
ignored = []
