[package]
name = "weaver_forge"
version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
weaver_common = { path = "../weaver_common", default-features = false }
weaver_resolved_schema = { path = "../weaver_resolved_schema", default-features = false }
weaver_semconv = { path = "../weaver_semconv", default-features = false }

# Template engine deps — gated behind "codegen" feature
weaver_diff = { path = "../weaver_diff", optional = true }
weaver_resolver = { path = "../weaver_resolver", optional = true }
minijinja = { version = "2.12.0", optional = true, features = [
    "loader",
    "custom_syntax",
    "debug",
    "json",
    "urlencode",
    "macros",
    "loop_controls",
] }
minijinja-contrib = { version = "2.12.0", optional = true, features = ["pycompat"] }
rayon = { workspace = true, optional = true }
walkdir = { workspace = true, optional = true }
dirs = { workspace = true, optional = true }
include_dir = { workspace = true, optional = true }
markdown = { version = "=1.0.0", optional = true }
textwrap = { version = "0.16.2", optional = true }

# Always available
jaq-core = "2.2.1"
jaq-std = "2.1.2"
jaq-json = { version = "1.1.3", features = ["serde_json"] }
indexmap = "2.11.4"
regex = "1.11.3"

convert_case.workspace = true
itertools.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_yaml.workspace = true
serde_json.workspace = true
globset.workspace = true
miette.workspace = true
schemars.workspace = true
log.workspace = true
utoipa = { workspace = true, optional = true }

[features]
default = ["codegen"]
codegen = [
    "dep:weaver_diff",
    "dep:weaver_resolver",
    "dep:minijinja",
    "dep:minijinja-contrib",
    "dep:rayon",
    "dep:walkdir",
    "dep:dirs",
    "dep:include_dir",
    "dep:markdown",
    "dep:textwrap",
    "weaver_common/io",
    "weaver_resolved_schema/io",
    "weaver_semconv/io",
]
openapi = ["utoipa"]

[dev-dependencies]
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-stdout.workspace = true
tempfile.workspace = true
