[package]
name = "weaver_common"
version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["io"]
io = [
    "dep:gix",
    "dep:openssl",
    "dep:rouille",
    "dep:ureq",
    "dep:tempfile",
    "dep:dirs",
    "dep:flate2",
    "dep:tar",
    "dep:zip",
]

[dependencies]
paris = { version = "1.5.15", features = ["macros"] }
serde.workspace = true
serde_json.workspace = true
miette.workspace = true
thiserror.workspace = true
regex.workspace = true
once_cell.workspace = true
schemars.workspace = true
log.workspace = true
url.workspace = true

# Heavy dependencies gated behind the "io" feature
rouille = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
dirs = { version = "6.0.0", optional = true }
gix = { version = "0.79.0", default-features = false, optional = true, features = [
    "comfort",
    "blocking-http-transport-reqwest-native-tls",
    "max-performance-safe",
    "worktree-mutation",
] }
openssl = { workspace = true, optional = true }
flate2 = { version = "1.1.4", optional = true }
tar = { version = "0.4.43", optional = true }
zip = { version = "5.1.1", optional = true }

[dev-dependencies]
ureq.workspace = true
walkdir.workspace = true
